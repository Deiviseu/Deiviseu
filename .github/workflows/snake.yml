name: Generate Pacman Contribution Graph

on:
  schedule:
    # roda todo dia às 03:00 UTC (meia-noite no horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pacman contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Deiviseu
          outputs: |
            dist/pacman-contribution-graph.svg?game=pacman&palette=github
            dist/pacman-contribution-graph-dark.svg?game=pacman&palette=github-dark

      - name: Push output to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
